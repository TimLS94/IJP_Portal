name: Live-Monitor (Playwright)

# Prüft regelmäßig die echte Seite (Chromium + WebKit/Safari) auf weiße Seiten /
# Abstürze und den Safari-localStorage-Regressionsfall. Schlägt einer der Tests
# fehl, markiert GitHub den Lauf als "failed" und schickt dir eine E-Mail.

on:
  schedule:
    - cron: "0 */3 * * *" # alle 3 Stunden
  workflow_dispatch: # manuell startbar über den Actions-Tab
    inputs:
      base_url:
        description: "Ziel-URL (Standard: Live-Seite)"
        required: false
        default: "https://www.jobon.work"

concurrency:
  group: live-monitor
  # Läufe NICHT abbrechen, sondern nacheinander abarbeiten. Ein Abbruch mitten in
  # der Browser-Installation verhindert sonst das Speichern des Browser-Caches.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.jobon.work' }}
      E2E_API_URL: "https://ijp-portal.onrender.com/api/v1"
      # Eingeloggter Dashboard-Check – nur aktiv, wenn diese Secrets gesetzt sind
      TEST_APPLICANT_EMAIL: ${{ secrets.TEST_APPLICANT_EMAIL }}
      TEST_APPLICANT_PASSWORD: ${{ secrets.TEST_APPLICANT_PASSWORD }}
      TEST_COMPANY_EMAIL: ${{ secrets.TEST_COMPANY_EMAIL }}
      TEST_COMPANY_PASSWORD: ${{ secrets.TEST_COMPANY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Playwright-Browser cachen -> schnelle Läufe (spart Actions-Minuten)
      - name: Playwright-Browser-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium webkit

      - name: Monitor ausführen
        run: npm run test:e2e

      - name: Report hochladen (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
